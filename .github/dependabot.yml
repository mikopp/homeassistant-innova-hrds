version: 2
# One PR bumps the Home Assistant image (e2e layer) and pytest-homeassistant
# (in-process layer) together: pytest-homeassistant's version number is the
# Home Assistant release it installs, and tests/ha/test_versions.py fails when
# the two drift apart (ADR-0004). A multi-ecosystem group is what lets one PR
# span the docker and pip ecosystems. If Dependabot opens separate PRs anyway,
# bump the other pin by hand in the same PR.
multi-ecosystem-groups:
  home-assistant:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Home Assistant image the e2e tests run against: keep it on the latest
  # release (grouped with pytest-homeassistant, see above).
  - package-ecosystem: "docker"
    directory: "/.github/ha-versions"
    multi-ecosystem-group: "home-assistant"
    patterns:
      - "ghcr.io/home-assistant/home-assistant"
  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: "home-assistant"
    patterns:
      - "pytest-homeassistant"
    ignore:
      - dependency-name: "pymodbus"  # follows the pinned Home Assistant
  - package-ecosystem: "pip"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "pymodbus"  # follows the pinned Home Assistant
